name: Build Executables

on:
  push:
    tags: ['v*']
  workflow_dispatch:  # 수동 실행도 가능

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install rich pyinstaller staticx patchelf

      - name: Stamp build date
        run: sed -i "s/^BUILD_DATE = .*/BUILD_DATE = \"$(date +%Y-%m-%d)\"/" src/koodyna/__init__.py

      - name: Build Linux executable
        run: |
          export PYTHONPATH="$(pwd)/src"
          pyinstaller --onefile \
            --name koodyna \
            --hidden-import=koodyna \
            --hidden-import=koodyna.cli \
            --hidden-import=koodyna.analyzer \
            --hidden-import=koodyna.models \
            --hidden-import=koodyna.parsers \
            --hidden-import=koodyna.parsers.d3hsp \
            --hidden-import=koodyna.parsers.glstat \
            --hidden-import=koodyna.parsers.status \
            --hidden-import=koodyna.parsers.profile \
            --hidden-import=koodyna.parsers.messag \
            --hidden-import=koodyna.parsers.nodout \
            --hidden-import=koodyna.parsers.bndout \
            --hidden-import=koodyna.parsers.matsum \
            --hidden-import=koodyna.parsers.element_mapper \
            --hidden-import=koodyna.parsers.rcforc \
            --hidden-import=koodyna.parsers.slurm \
            --hidden-import=koodyna.scanner \
            --hidden-import=koodyna.analysis \
            --hidden-import=koodyna.analysis.energy \
            --hidden-import=koodyna.analysis.timestep \
            --hidden-import=koodyna.analysis.warnings \
            --hidden-import=koodyna.analysis.contact \
            --hidden-import=koodyna.analysis.performance \
            --hidden-import=koodyna.analysis.diagnostics \
            --hidden-import=koodyna.analysis.numerical_instability \
            --hidden-import=koodyna.analysis.failure_analysis \
            --hidden-import=koodyna.analysis.matsum_analysis \
            --hidden-import=koodyna.analysis.implicit_diagnostics \
            --hidden-import=koodyna.report \
            --hidden-import=koodyna.report.terminal \
            --hidden-import=koodyna.report.json_report \
            --hidden-import=koodyna.report.html_report \
            --hidden-import=koodyna.report.svg_chart \
            --hidden-import=koodyna.knowledge \
            --hidden-import=koodyna.knowledge.warning_db \
            --hidden-import=koodyna.knowledge.error_db \
            --paths=src \
            src/koodyna/__main__.py
          chmod +x dist/koodyna

      - name: Make static binary (no shared lib dependencies)
        run: staticx dist/koodyna dist/koodyna-static && mv dist/koodyna-static dist/koodyna

      - name: Verify build
        run: ./dist/koodyna --help || true

      - uses: actions/upload-artifact@v4
        with:
          name: koodyna-linux
          path: dist/koodyna

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install rich pyinstaller

      - name: Stamp build date
        run: |
          $today = Get-Date -Format "yyyy-MM-dd"
          (Get-Content src/koodyna/__init__.py) -replace '^BUILD_DATE = .*', "BUILD_DATE = `"$today`"" | Set-Content src/koodyna/__init__.py
        shell: pwsh

      - name: Build Windows executable
        run: |
          $env:PYTHONPATH = "$(Get-Location)\src"
          pyinstaller --onefile `
            --name koodyna `
            --hidden-import=koodyna `
            --hidden-import=koodyna.cli `
            --hidden-import=koodyna.analyzer `
            --hidden-import=koodyna.models `
            --hidden-import=koodyna.parsers `
            --hidden-import=koodyna.parsers.d3hsp `
            --hidden-import=koodyna.parsers.glstat `
            --hidden-import=koodyna.parsers.status `
            --hidden-import=koodyna.parsers.profile `
            --hidden-import=koodyna.parsers.messag `
            --hidden-import=koodyna.parsers.nodout `
            --hidden-import=koodyna.parsers.bndout `
            --hidden-import=koodyna.parsers.matsum `
            --hidden-import=koodyna.parsers.element_mapper `
            --hidden-import=koodyna.parsers.rcforc `
            --hidden-import=koodyna.parsers.slurm `
            --hidden-import=koodyna.scanner `
            --hidden-import=koodyna.analysis `
            --hidden-import=koodyna.analysis.energy `
            --hidden-import=koodyna.analysis.timestep `
            --hidden-import=koodyna.analysis.warnings `
            --hidden-import=koodyna.analysis.contact `
            --hidden-import=koodyna.analysis.performance `
            --hidden-import=koodyna.analysis.diagnostics `
            --hidden-import=koodyna.analysis.numerical_instability `
            --hidden-import=koodyna.analysis.failure_analysis `
            --hidden-import=koodyna.analysis.matsum_analysis `
            --hidden-import=koodyna.analysis.implicit_diagnostics `
            --hidden-import=koodyna.report `
            --hidden-import=koodyna.report.terminal `
            --hidden-import=koodyna.report.json_report `
            --hidden-import=koodyna.report.html_report `
            --hidden-import=koodyna.report.svg_chart `
            --hidden-import=koodyna.knowledge `
            --hidden-import=koodyna.knowledge.warning_db `
            --hidden-import=koodyna.knowledge.error_db `
            --hidden-import=tkinter `
            --hidden-import=tkinter.filedialog `
            --hidden-import=tkinter.scrolledtext `
            --hidden-import=webbrowser `
            --paths=src `
            src/koodyna/__main__.py
        shell: pwsh

      - name: Verify build
        run: dist\koodyna.exe --help
        shell: cmd
        continue-on-error: true

      - uses: actions/upload-artifact@v4
        with:
          name: koodyna-windows
          path: dist/koodyna.exe

  # tag push 시 Release 자동 생성 + 바이너리 첨부
  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: koodyna-linux
          path: artifacts/linux

      - uses: actions/download-artifact@v4
        with:
          name: koodyna-windows
          path: artifacts/windows

      - name: Rename artifacts
        run: |
          mv artifacts/linux/koodyna artifacts/koodyna-linux-x86_64
          mv artifacts/windows/koodyna.exe artifacts/koodyna-windows-x64.exe

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/koodyna-linux-x86_64
            artifacts/koodyna-windows-x64.exe
          generate_release_notes: true
